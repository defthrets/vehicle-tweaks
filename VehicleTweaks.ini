; ============================================================================
;  Vehicle Tweaks - settings
; ============================================================================
;
;  Two ideas, and neither of them says a word while it works:
;
;    THE IGNITION is yours instead of the game's. Hold the exit key to stop the
;      engine without getting out; tap it to get out and leave the car as it
;      stands - running, playing, lit, door open - and get in, where nothing
;      starts until you touch the throttle and the starter has turned over.
;
;    THE INDICATORS are worked by the steering wheel and cancel themselves, the
;      way a real column stalk does. Hazards are on a key of their own.
;
;  And the small print of parking a car: the handbrake goes on behind you, the
;  seatbelt is on unless you took it off, and the doors lock.
;
;  Every setting here has a built-in default. Delete a line and the default
;  applies; delete the whole file and the mod still runs. Anything that cannot
;  be understood is reported in VehicleTweaks.log and then ignored.
;
;  YOU DO NOT HAVE TO EDIT THIS FILE. Everything in it is in the settings panel
;  on F8, which applies a change the instant you make it and writes it back
;  here - in place, keeping these comments - when you close it. That is the way
;  to tune the feel settings, because you can try the change on the next corner
;  instead of alt-tabbing.
;
;  Hand edits to this file take effect on a script reload (the SHVDN reload key)
;  or a restart.
; ============================================================================


[General]

Enabled = true

; Says hello in the notification feed the first time it ticks.
;
; OFF, which is the opposite of what most mods do. The whole design here is that
; nothing announces itself - an engine you left running is not an event, and an
; indicator is not a notification - and a mod that opens by posting its own name
; has broken that before it has done anything. VehicleTweaks.log records the load
; either way, which is where you look if you want to know it is running.
AnnounceOnLoad = false

; A MOMENT OF SLOW MOTION WHEN YOU HIT SOMETHING HARD ENOUGH.
;
; THE ONE THING IN THIS MOD THAT REACHES OUTSIDE YOUR CAR. Time scale is global and
; it is persistent - it is the speed of the whole world, and nothing puts it back on
; its own. A script that slows it down and then dies leaves the game in slow motion
; for ever with nothing to explain it. So it is put back when the moment ends, when
; you leave the car, when this is switched off, when the script shuts down, and after
; a hard ceiling regardless of any of that.
CrashSlowMo = true

; How fast you have to have been going, in kilometres an hour, the instant before it.
CrashSlowMoSpeed = 100

; How much speed has to vanish inside a single frame, in metres a second.
;
; This is what separates a crash from touching something. The game will happily tell
; you a kerb was hit; eight metres a second in one frame is about fifty g, which
; braking cannot do and a scrape cannot do. LOWER THIS if big crashes go by
; untouched, raise it if kerbs set it off.
CrashSlowMoDrop = 8.0

; How slow, as a fraction of normal, and for how long. The length is in game time,
; which is itself slowed - so it lasts longer on the clock than the number reads.
CrashSlowMoScale = 0.40
CrashSlowMoSeconds = 0.60

; THE SETTINGS PANEL: a key, and what has to be held down with it.
; MenuModifier is None | Shift | Control | Alt.
;
; NO MODIFIER, because F8 does not need one. A modifier is what a LETTER needs:
; a bare letter is one keystroke from whatever else you have bound it to, this
; game has mods on most of the alphabet, and the vanilla letters are all spoken
; for - V, the obvious choice for a vehicle mod, is the camera key. Vanilla binds
; nothing at all to F8, so there is no conflict for a modifier to resolve.
;
; Set MenuModifier if your other mods have claimed F8 and you would rather keep
; the key than move it.
;
; In the panel: TAB changes page, UP and DOWN move, LEFT and RIGHT change a
; setting, ENTER works a row, F8 or BACKSPACE saves and closes. On a pad it is
; the D-pad, A and B - and UP and DOWN run off the end of one page onto the next,
; so the whole panel is reachable without a page button. Changes take
; effect the instant you make them - the next corner uses the number you just set
; - and are written back into THIS file, in place, keeping every comment, when
; you close it. Only the lines you actually changed are touched.
MenuKey = F8

MenuModifier = None

; THE PAD'S WAY IN: a control held, and a control pressed.
;
; A CHORD, because there is no spare button on a pad. Every face button, shoulder
; and stick is a gameplay action and the D-pad changes the radio station - so a
; single button would either collide with something or have to be one you never
; press, and holding one while pressing another is not something a thumb does by
; accident. This only fires while you are actually using a pad, so it does not
; quietly become a second keyboard shortcut.
;
; The default is: hold VIEW / SELECT / touchpad, press D-PAD UP.
;
; These are names out of SHVDN's GTA.Control list, not key names. PadOpen = Off
; stops the pad opening the panel at all; PadModifier = None makes it a single
; button. Whatever you put here, the log says what it resolved to on start-up -
; and says so loudly if it could not resolve it, because a chord that never fires
; and a pad that is not being read look identical from the sofa.
;
; This is the one part of the mod that was written without a pad to try it on. If
; the default does not work, it is meant to be fixed here rather than reported.
PadOpen = PhoneUp

PadModifier = MultiplayerInfo

; Error | Warn | Info | Debug.  Debug is loud but it is what to send with a
; bug report.
;
; Worth knowing where this file goes: beside the dll if the game folder is
; writable, and in Documents\VehicleTweaks\ if it is not, which is what happens
; on a normal Program Files install. Neither feature says anything on screen, so
; the log is the only thing either of them can use to tell you what it did.
LogLevel = Info


[Autopilot]

; CRUISE CONTROL - holds the speed you set it at.
;
; A CAP RATHER THAN A THROTTLE. The game is told this car may not exceed a speed,
; which is a far smaller instrument than driving the accelerator for you: steering
; and braking stay entirely yours, and the worst a bug in here can do is limit a car
; rather than drive one.
;
; Press the key at the speed you want held. Braking cancels it, as it does in every
; car that has ever had cruise control, and so does getting out.
Cruise = true
CruiseKey = U

; The pad, using the panel's own held modifier. "Off" for none.
PadCruise = Off

; SELF DRIVING - the task every ambient driver in the city is already running.
;
; Nothing here steers. The car obeys lights, overtakes, gives way and finds its way
; exactly as traffic does, because it IS traffic's own task.
;
; OFF BY DEFAULT. It is the most control this mod ever takes, and taking the wheel
; out of somebody's hands is a thing to be asked for rather than switched on by an
; update.
;
; TOUCH ANY CONTROL AND IT IS YOURS AGAIN - throttle, brake, handbrake or steering.
; It also stops on the key, on getting out, on being switched off here, and when the
; script shuts down. Grabbing the wheel is what anybody would try first, so that is
; what works.
AutoDrive = false
AutoDriveKey = O
PadAutoDrive = Off

; What it aims for, in kilometres an hour. Traffic and corners have their own
; opinions about whether it gets there.
AutoDriveSpeed = 60

; Cautious | Normal | Brisk | Reckless.
;
;   Cautious   stops for people as well as cars, and waits at lights
;   Normal     stops for cars, and waits at lights
;   Brisk      goes around what is in the way instead of queueing, still stops at red
;   Reckless   neither stops nor waits
;
; RECKLESS IS NOT A JOKE SETTING. It will take you through a junction on red.
AutoDriveStyle = Normal


[Speedo]

; A SPEED READOUT: three seven-segment digits, a unit, a rev strip and the gear.
;
; The one thing this mod leaves on the screen. Everything else here is silent on
; purpose and stays that way - silence was always about not INTERRUPTING, with no
; prompts and nothing to dismiss. A dial you glance at is what a car already has,
; and it is the one thing the game itself does not give you.
;
; The digits are drawn as segments rather than typed in a font, because none of the
; four fonts GTA ships is a seven-segment one, so any of them would have been an
; ordinary number in an ordinary typeface with a box behind it.
Speedo = true

; Kph or Mph.
SpeedoUnits = Kph

; Amber | Red | Green | Cyan | Blue | White.
;
; A short list rather than three colour sliders: red, green and blue as separate
; numbers is sixteen million combinations, almost none of which any dashboard has
; ever been made in. These are the ones real displays use.
SpeedoColour = Amber

; The cells under the digits that fill as the engine revs, and the gear beside them.
; The last fifth of the strip is red whatever colour the rest is, because that is
; the one thing a rev counter is for. Reverse shows as a lower-case r, which is the
; only R that seven segments can make.
SpeedoRevs = true
SpeedoGear = true

; WHERE THE WARNING LAMPS SIT - which is not wherever the speedo is.
;
; They are their own cluster, with their own place and their own dark backing. They
; started out bolted onto the end of the speed readout and that was wrong: a readout
; is one object you glance at continuously, and a warning lamp is meant to catch
; your eye precisely BY not being part of what you were already looking at.
;
; Above and to the left of the speedo by default. Same as below - do not count these
; numbers, watch them, because the panel draws the lamps while it is open.
SpeedoLampsX = 0.268
SpeedoLampsY = 0.886

; WHERE IT SITS, as fractions of the screen from the top left corner.
;
; The default is immediately right of the minimap and level with its bottom edge.
; That is an ESTIMATE and it cannot be anything better: where the minimap actually
; ends depends on your safe-zone slider and your aspect ratio, and there is no way
; for a script to ask.
;
; So do not count these numbers - watch them. The settings panel keeps drawing the
; speedo while it is open, including on foot, so hold LEFT or RIGHT on Across and
; the thing you are moving moves while you look at it.
SpeedoX = 0.268
SpeedoY = 0.928

; Everything scales together, the rev strip included. 0.4 to 3.0.
SpeedoScale = 1.00

; The whole thing at once, backing included. 0.15 to 1.0.
SpeedoOpacity = 0.90

; A dark panel behind it, so it still reads against a white car in daylight.
SpeedoBackground = true

; Unlit segments drawn faintly, the way a real display shows them - an LCD reading
; 42 also faintly shows the 8 it is not lighting. Without it the digits appear to
; jump about as the speed changes width.
SpeedoGhost = true

; THE ENGINE LAMP, coloured green, amber or red by how well the engine is.
;
; GTA has always tracked this and has never once shown it to you. Those colours
; rather than the display's own, because a warning lamp is a judgement and everybody
; already knows what a red one means - an engine light that came out blue because
; you picked blue would be a decoration that happens to change.
;
; Healthy is drawn dimmer than the two warnings. A lamp you notice is one that was
; quiet until it had something to say.
SpeedoEngineIcon = true

; THE OIL LAMP, lit only when the oil is low - which is the whole point of it. A
; warning light that is on all the time is decoration.
;
; Measured against the engine's own capacity, which the game knows, rather than
; against a number of litres that would be right for one car and wrong for the rest.
SpeedoOilLight = true

; Off shows it on foot as well. It is drawn regardless while the panel is open, so
; that the position rows above are usable from anywhere.
SpeedoOnlyInVehicle = true


[Driving]

; THE IGNITION IS YOURS, not the game's.
;
;   Hold the exit key and the engine stops. You do not get out.
;   Tap it and you get out, and the car is left exactly as it stands - running
;     if it was running, dead if you turned it off first.
;   Get in and nothing happens. It starts when you touch the throttle.
;
; Silent on purpose: no prompt, no notification. A car that keeps running when
; you walk away from it is not an event, it is how a car works.
ManualIgnition = true

; How long the exit key counts as held rather than tapped, in seconds.
ExitHoldSeconds = 0.30

; How fast the car can be moving, in metres a second, before the exit key is
; handed back to the game untouched. 2.5 is a brisk walk.
;
; Above it the game handles the key exactly as it always did - hold to bail out.
; A tap that ejects you at sixty is not what a tap should do, and refusing the tap
; on its own would have left no way out of a moving car at all, since hold means
; "stop the engine" here.
ManualIgnitionMaxSpeed = 2.5

; Whether aircraft get it too. They do not by default: the gesture that parks a
; car is the one that kills you in a helicopter, and it is the same key you use
; to climb out on the ground.
ManualIgnitionAircraft = false

; THE STARTER TURNS OVER before the engine catches, instead of the engine simply
; being on the instant you touch the throttle.
;
; This is not a delay we invented and not a sound we play - it hands the start to
; the game, which has its own cranking, its own starter sound and its own length
; for the engine in that particular car. A half second we made up would be the
; same half second in a moped and a tanker.
;
; If the engine ever fails to catch, it is started outright after three seconds
; and the log says so. Turn this off if that keeps happening.
StarterCranks = true

; DRIFT - a slider, 0.00 to 1.00. 0 is off.
;
; A slider and not a list of four words, because how much a car drifts is plainly a
; continuous thing and picking between Light and Medium is not the same as finding
; the one that feels right. Nudge it on the panel while you are driving and the car
; changes under you.
;
; 0.20 is a light default: enough to feel on a roundabout, not enough to be a
; nuisance on a motorway.
;
; TWO OF ROCKSTAR'S OWN UNDERNEATH IT, and nothing here models grip or fakes a slide.
;
; SET_DRIFT_TYRES is the Drift Races tuning and it is the better of the two - the
; handling Rockstar wrote, on their terms. But it is GATED to the cars that update
; gave it to, and on anything else it does not fail, it is simply ignored. So on its
; own it was never going to be "drift on any car", and it is on or off with nothing
; in between.
;
; The friction override is the second one. It goes on anything and it takes a FLOAT,
; which is what makes this a slider at all - it is scaled by the number above on
; every car, so turning the knob does something whatever you are driving. Full tilt
; takes half the grip away. Half and not all: a car with no friction does not drift,
; it stops being connected to the road, and there is no interesting driving in the
; last stretch of that range.
;
; The log says which of the two each car got.
;
; Cars lose it again when you set this to 0 or reload the script. A car that ALREADY
; had drift tuning when the mod found it keeps it and is never touched - somebody
; paid for that at a garage and it is not ours to remove.
DriftAmount = 0.20

; THE ENGINE KEEPS PULLING WHILE THE CAR IS SIDEWAYS.
;
; GTA bogs a car down the moment it stops pointing where it is going, and that is
; what makes long drifts collapse: the back comes out, the power falls away
; underneath you, and the slide dies of its own accord rather than because you ended
; it. Holding a drift in this game is mostly a fight against the car giving up.
;
; Done with the per-CAR engine power multiplier, not with handling data - handling is
; per model and would change every other example of that car in the world for the
; rest of the session.
DriftPower = true

; How much power it finds at full slide. 1.00 is none at all.
;
; It comes in gradually as the angle opens up rather than switching on at a line. A
; car that suddenly found half as much power again at twelve degrees would be harder
; to hold than one that never found any.
DriftPowerBoost = 1.40

; MORE STEERING LOCK WHILE THE CAR IS SIDEWAYS, so a slide can be caught.
;
; This is how a real drift car is built. Extended steering angle is the single most
; common modification made to one, and for exactly this reason: catching a slide
; means winding on more opposite lock than the car came with, and once you run out
; of lock there is nothing left to do but wait and see where it goes. The stock
; limit is most of why GTA slides feel like they end of their own accord rather than
; because you saved them.
;
; Per WHEEL and per car, and it asks the game which wheels steer rather than assuming
; the front two.
CounterSteer = true

; How much more lock at full slide. 1.00 is the car as it came.
;
; It arrives on the same ramp as the power, so both come in as the angle opens rather
; than switching on at a line - a car whose steering suddenly got quicker mid-corner
; would be harder to hold, not easier.
CounterSteerLock = 1.60

; How far sideways you have to be, in degrees, before all of that lock has arrived.
;
; The half that used to be hard-coded. How MUCH extra lock was a setting from the
; start; WHERE it turns up was three times the slide angle and nothing else - and
; where it turns up is the part you actually feel. Arriving too early is a car that
; goes vague the moment it steps out; too late is running out of steering in the one
; moment it was needed.
;
; Thirty degrees is a proper slide, held. Under about fifteen and the extra lock is
; all there before you have noticed the back move.
;
; Separate from the power's ramp on purpose. The power is undoing something the game
; does to a sideways car, so it follows the game's problem - full by three times the
; slide angle. The lock is giving you something, so where it arrives is taste, and
; taste is what a setting is for.
CounterSteerFull = 30

; How far sideways counts as a slide, in degrees - the angle between where the car is
; pointing and where it is actually travelling, which is what a drift IS. Twelve is
; past what a fast corner asks for and short of what a deliberate slide gives you.
DriftAngle = 12

; THE CABIN LIGHTS UP WITH THE HEADLIGHTS.
;
; Tied to the headlights rather than to the clock, which is both simpler and more
; faithful: a real dashboard lights with the side lights, which is why going into a
; tunnel at noon lights your instruments. The game already turns your headlights on
; when it gets dark, so this follows a decision that has already been made properly.
;
; Switched off again when you get out, because it is a state set on somebody else's
; car and a parked one glowing from the inside for ever would be this mod's litter.
DashLight = true

; FRONT-WHEEL-DRIVE CARS KEEP PULLING WHEN THE HANDBRAKE IS ON.
;
; A handbrake is a REAR brake - a cable to the back wheels, which is why a rear-drive
; car spins on it. In a front-driver the driven wheels are the ones it does not touch,
; so the engine can still drag the car forward against a locked rear axle. The game
; brakes the car as a unit and the fronts give up along with everything else.
;
; Only on cars that drive their fronts AND NOT their rears, asked of the wheels
; themselves rather than worked out from the handling numbers. Four-wheel drive is a
; different situation - its rear wheels are driven too - and is left alone.
;
; TWO HALVES, and the second is the one you can see. Pushing the car moves the CAR -
; the wheels under it only roll at whatever speed the road is going past, which
; against a handbrake is barely at all, so the fronts sat there motionless while the
; car strained. Wheelspin is not a fast roll, it is the tyre losing to the engine,
; and no amount of pushing produces it. SET_VEHICLE_BURNOUT does, and it spins the
; DRIVEN wheels - which on a front-driver are the front ones.
;
; It only does anything while you hold the handbrake AND the throttle together. The
; handbrake on its own still stops the car dead, which is what it is for. The front
; wheels also have to be on the ground, because a wheel in the air has nothing to put
; the engine's torque through.
;
; DONE BY PUSHING THE CAR, NOT BY EDITING ITS HANDLING. There is a HandBrakeForce in
; the handling data and turning it down looks like the obvious fix - it is not.
; Handling is loaded per MODEL rather than per car, so weakening it would weaken the
; handbrake on every other example of that model in the world, traffic included, for
; the rest of the session, with nothing to put it back.
FwdHandbrake = true

; How hard they pull, in metres per second squared.
;
; A real unit, not a magic number: the game is handed this acceleration times the
; length of the frame, every frame, which adds up to exactly this acceleration
; whatever your frame rate and whatever you are driving. 1.5 is a car dragging
; itself forward against a locked rear axle. Raise it if it feels too polite - the
; handbrake is braking against you the whole time, so this has to be a real number
; before anything is visible. It goes to 15.
;
; If you had the very first version of this and it launched you across the street:
; that was the pull being multiplied by the car's mass as well, which asked for
; about fifteen hundred times too much. It is fixed, and there is now a ceiling on
; how much any single frame can add so that it cannot happen again.
FwdHandbrakePull = 8.0

; How fast it can drag the car, in metres a second, before the fronts give up. Eight
; is a fast jog. The point is a car that still creeps and still pivots with the
; handbrake up, not one that drives around on it - a locked rear axle should win in
; the end. The pull eases off as it approaches this rather than cutting out at it.
FwdHandbrakeMaxSpeed = 8.0

; THE SEATBELT, WHICH YOU ARE WEARING UNLESS YOU TOOK IT OFF.
;
; The wrong way round on purpose. A belt you have to fasten needs somewhere to tell
; you whether you did - the benefit is invisible right up until the one crash where
; you do not go through the windscreen - and this mod has no HUD while you drive.
; Belted by default, with a key to UNDO it, means the question never comes up.
;
; Taking it off sticks until you get out of that car, or the belt would simply go
; back on a second later and the key would look broken.
Seatbelt = true

SeatbeltKey = K

; The pause after getting in, before it goes on. Not instant, because instant is a
; thing that happens TO you - and this is long enough that hopping in and straight
; out again never involves a belt at all.
SeatbeltSeconds = 1.0

; The pad: the panel's own held modifier, and D-PAD LEFT. A GTA.Control name, or
; "Off" for no pad unbuckle at all.
PadSeatbelt = PhoneLeft


[Leaving]

; A car left running keeps its radio on, and loud enough to hear from outside it.
; The station is whatever was playing as you got out. A car left switched OFF gets
; its radio switched off too - a dead car with a stereo on is a flat battery.
RadioKeepsPlaying = true

; Headlights are left the way you left them - the third thing you leave on, after
; the engine and the radio. The game switches them off as you climb out, which is
; the same argument it has about the engine, answered the same way.
;
; They go out with the engine: if the car stops running, or you get back in, the
; lights are handed back to you and to the game.
LightsStayAsLeft = true

; The driver's door is left hanging open when you step out, and shut again when you
; get back in and are actually sitting down.
;
; A passing car will also shut it for you, at some cost to the door. Turn this off
; if that is not the kind of realism you were after.
LeaveDoorOpen = true

; The handbrake goes on when you step out, and comes off when you get back in.
;
; The one omission from "left as you left it" that actually costs you the car: park
; on any of the hills in this city without it and the car is at the bottom of the
; hill when you come back.
HandbrakeOnExit = true

; LOCKING YOUR CAR - the one you are in, or the last one you drove if you are stood
; within twelve metres of it. Your car, never the nearest one: a key in your pocket
; does not lock a stranger's car because they parked closer.
;
; Worth more since the door started being left open, which is exactly the invitation
; it looks like. That is the choice, and it is the point: lock it and walk away, or
; leave it running with the door open because you will only be a second.
Locking = true

LockKey = L

; The horn blips when it locks.
;
; This is feedback that is also the feature. Locking is invisible otherwise - nothing
; about the car looks different - so a key that locks it silently is a key you cannot
; tell you pressed. A notification would be the mod talking; a chirp is the car
; talking, which is the only voice it is supposed to have.
LockChirp = true

; The pad: the panel's own held modifier, and D-PAD RIGHT. So one button held gives
; D-PAD UP for the panel, DOWN for the hazards, LEFT for the belt and RIGHT for the
; locks - one thing to learn rather than four.
PadLock = PhoneRight


; YOUR CAR IS STILL THERE WHEN YOU COME BACK.
;
; GTA throws away vehicles nobody is looking at, which is the most everyday
; annoyance in the game and makes nonsense of everything else in here: a car left
; running, lit, locked and handbraked is not much use if it is deleted the moment
; your back is turned.
;
; EXACTLY ONE CAR is held - the last one you drove - and taking a different one
; hands the previous one straight back. Persistence tells the game a vehicle may
; never be cleaned up, and handing that out freely fills the world's budget with
; cars nobody is ever coming back for.
KeepParked = true

; A blip on it, because a car that is still there is no good if you cannot remember
; which street you left it on. Short range, so it is something you navigate back to
; rather than a marker sitting over the map all day.
;
; It goes away while you are sitting in the car. The blip answers "where did I leave
; it", which is not a question anybody has from the driver's seat - there it is just
; a marker riding along on top of you saying where you already are.
ParkedBlip = true

; Each car remembers what it was playing, so getting back in puts you on the station
; you left it on instead of whatever the game picks. One of those things nobody
; notices until it is missing - which in GTA it is, so the first ten seconds of every
; journey go on cycling back to where you already were.
;
; This session only. Remembering across sessions means a file to write, and this mod
; writes nothing but its log.
RememberStations = true


[Indicators]

; INDICATORS, WORKED BY THE STEERING WHEEL.
;
; Hold the wheel over for a second and that side comes on. It goes off when you
; steer the other way - which is what straightening out of a turn is - or when
; you have been driving without steering that way for a couple of seconds.
;
; LETTING GO DOES NOT CANCEL IT. Sitting at a red light you turn the wheel, let it
; centre, and it stays on; that is how you signal before you have moved. The
; straight-ahead cancel only counts while the car is actually moving, above
; BlinkerMinSpeed.
;
; Turning the same way again does NOT put it out - and the reason that needs
; saying is that straightening between two turns the same way is itself a turn
; the other way. Only a HELD turn the other way cancels; a flick to line the car
; up does not.
Blinkers = true

; How long the wheel is held over before that side comes on.
BlinkerArmSeconds = 1.0

; Driving straight for this long cancels it.
BlinkerCancelSeconds = 2.0

; How long the wheel must be held the other way before it cancels. Short, but not
; nothing: coming out of a turn you hold it over for the best part of a second,
; lining up between two turns is a flick.
BlinkerOppositeSeconds = 0.6

; How far the wheel counts as turned at all, 0 to 1.
BlinkerDeadzone = 0.35

; How fast the car must be going, in metres a second, for a centred wheel to mean
; anything. Below it a centred wheel is just one nobody is holding.
BlinkerMinSpeed = 1.5

; HAZARDS: both sides at once.
;
; A key, because there is no gesture left. The indicators are worked by the wheel
; and there is no steering input that means "both" - you cannot hold it left and
; right at once, which is exactly why a real car puts hazards on their own switch
; instead of on the stalk.
;
; J because it is free: H is the vanilla headlight key and E is the horn.
;
; Hazards belong to the CAR, not to you. Leave one on its hazards, walk off, and it
; is still on them when you come back; get into a different car and it is not.
HazardKey = J

; The pad's hazards: the panel's own modifier (PadModifier, up in [General]) held,
; and this pressed. One button held, then D-PAD UP for the panel or D-PAD DOWN for
; the hazards, is one thing to learn instead of two.
;
; A GTA.Control name, same as PadOpen. "Off" for no pad hazards at all.
PadHazard = PhoneDown

; Only for setups where the one-sided steering controls report nothing. The normal
; path reads each side's own control, so there is no left-right convention to get
; backwards; this swaps the fallback if it ever comes out mirrored.
BlinkerInvert = false
